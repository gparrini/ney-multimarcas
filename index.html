<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Ney Multimarcas — Moda Masculina</title>
<meta name="description" content="Ney Multimarcas — Moda Masculina. Fale conosco no WhatsApp, veja o catálogo, encontre a loja e siga no Instagram.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fire-red:#f0330d;
    --fire-orange:#f07000;
    --fire-amber:#f0a300;
    --fire-gold:#f0d000;
    --silver:#e9edf2;
    --ink:#0a0a0a;
    --card-glass:rgba(14,10,9,0.55);
    --card-border:rgba(240,112,0,0.55);
    --shadow-fire:0 10px 30px -8px rgba(240,64,0,0.55);
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html,body{min-height:100%;}

  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--silver);
    background:var(--ink);
    position:relative;
    overflow-x:hidden;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ---- Background image + overlay ---- */
  .bg{
    position:fixed;
    inset:0;
    z-index:-2;
    background-image:url("background.jpg");
    background-size:cover;
    background-position:center 35%;
    transform:scale(1.06);
    animation:bgDrift 26s ease-in-out infinite alternate;
    will-change:transform;
  }
  .bg-overlay{
    position:fixed;
    inset:0;
    z-index:-1;
    background:
      radial-gradient(120% 80% at 50% 12%, rgba(240,80,0,0.10) 0%, transparent 45%),
      radial-gradient(80% 55% at 50% 62%, rgba(6,6,8,0.28) 0%, transparent 78%),
      linear-gradient(180deg, rgba(6,6,8,0.45) 0%, rgba(6,6,8,0.30) 30%, rgba(6,6,8,0.42) 60%, rgba(6,6,8,0.75) 100%);
  }

  @keyframes bgDrift{
    from{transform:scale(1.06) translateY(0);}
    to{transform:scale(1.12) translateY(-12px);}
  }

  /* ---- Layout shell ---- */
  .wrap{
    position:relative;
    z-index:1;
    max-width:520px;
    margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 34px) 22px calc(env(safe-area-inset-bottom) + 40px);
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100dvh;
  }

  /* ---- Logo ---- */
  .logo{
    width:min(88%,420px);
    height:auto;
    margin-top:6px;
    filter:drop-shadow(0 6px 22px rgba(0,0,0,0.6));
    opacity:0;
    transform:translateY(-26px) scale(0.94);
    animation:logoIn 1s cubic-bezier(.16,.84,.32,1) 0.15s forwards;
  }
  @keyframes logoIn{
    to{opacity:1;transform:translateY(0) scale(1);}
  }

  /* subtle floating glow behind logo */
  .logo-glow{
    position:absolute;
    top:46px;
    width:min(70%,320px);
    height:130px;
    background:radial-gradient(ellipse at center, rgba(240,96,0,0.20), transparent 70%);
    filter:blur(34px);
    z-index:-1;
    animation:glowPulse 5.5s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%,100%{opacity:.5;transform:scale(1);}
    50%{opacity:.8;transform:scale(1.04);}
  }

  /* ---- Cards ---- */
  .links{
    width:100%;
    margin-top:34px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .card{
    --c1:var(--fire-orange);
    --c2:var(--fire-red);
    position:relative;
    display:flex;
    align-items:center;
    gap:16px;
    padding:16px 18px;
    border-radius:20px;
    text-decoration:none;
    color:var(--silver);
    background:
      linear-gradient(135deg, rgba(28,20,18,0.42), rgba(10,8,8,0.30));
    border:1px solid rgba(255,255,255,0.10);
    box-shadow:0 10px 28px -14px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.08);
    overflow:hidden;
    isolation:isolate;
    backdrop-filter:blur(18px) saturate(1.4);
    -webkit-backdrop-filter:blur(18px) saturate(1.4);
    /* stagger entrance */
    opacity:0;
    transform:translateY(22px);
    animation:cardIn .6s cubic-bezier(.16,.84,.32,1) forwards;
    transition:transform .35s cubic-bezier(.16,.84,.32,1), box-shadow .35s ease, border-color .35s ease, background .35s ease;
  }

  /* fire accent bar on the left */
  .card::before{
    content:"";
    position:absolute;
    left:0;top:0;bottom:0;
    width:4px;
    background:linear-gradient(180deg, var(--c1), var(--c2));
    box-shadow:0 0 10px -2px var(--c1);
    z-index:2;
  }
  /* glow sheen that sweeps on hover */
  .card::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.08) 48%, transparent 66%);
    transform:translateX(-120%);
    transition:transform .7s ease;
    z-index:1;
    pointer-events:none;
  }

  .card:hover, .card:active{
    transform:translateY(-4px) scale(1.015);
    border-color:var(--card-border);
    background:linear-gradient(135deg, rgba(32,23,20,0.52), rgba(10,8,8,0.38));
    box-shadow:0 18px 40px -16px rgba(0,0,0,0.7), 0 0 0 1px rgba(240,112,0,0.25), 0 8px 24px -14px var(--c1);
  }
  .card:hover::after, .card:active::after{ transform:translateX(120%); }
  .card:hover .ic{ transform:scale(1.06); }

  .card:active{ transform:translateY(-1px) scale(0.99); transition-duration:.1s; }

  @keyframes cardIn{
    to{opacity:1;transform:translateY(0);}
  }
  .card:nth-child(1){animation-delay:.5s;}
  .card:nth-child(2){animation-delay:.6s;}
  .card:nth-child(3){animation-delay:.7s;}
  .card:nth-child(4){animation-delay:.8s;}

  /* Icon capsule */
  .ic{
    flex:0 0 auto;
    width:52px;height:52px;
    border-radius:16px;
    display:grid;place-items:center;
    background:linear-gradient(140deg, var(--c1), var(--c2));
    box-shadow:0 6px 16px -6px var(--c1), inset 0 1px 0 rgba(255,255,255,0.35);
    position:relative;
    z-index:2;
    transition:transform .35s cubic-bezier(.16,.84,.32,1);
  }
  .ic svg{width:28px;height:28px;display:block;}
  .ic.ig{ background:linear-gradient(135deg,#f9ce34 0%,#ee2a7b 45%,#6228d7 100%); box-shadow:0 6px 16px -6px rgba(238,42,123,.5), inset 0 1px 0 rgba(255,255,255,0.35);}
  .ic.wa{ background:linear-gradient(140deg,#37e07d,#12b866); box-shadow:0 6px 16px -6px rgba(18,184,102,.45), inset 0 1px 0 rgba(255,255,255,0.35);}

  .txt{ z-index:2; display:flex; flex-direction:column; gap:3px; }
  .txt .t{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:.6px;
    line-height:1;
    color:#fff;
    text-transform:uppercase;
    text-shadow:0 1px 4px rgba(0,0,0,0.45);
  }
  .txt .s{
    font-size:12px;
    font-weight:600;
    letter-spacing:.4px;
    color:var(--c-sub, var(--fire-amber));
    text-transform:uppercase;
    opacity:.85;
  }

  .arrow{
    margin-left:auto;
    z-index:2;
    color:rgba(233,237,242,0.5);
    transition:transform .3s ease, color .3s ease;
  }
  .arrow svg{width:20px;height:20px;display:block;}
  .card:hover .arrow{ transform:translateX(4px); color:var(--c1); }

  /* Per-card theming */
  .card.wa{ --c1:#2ee06e; --c2:#0f9b52; --c-sub:#54e58a; }
  .card.cat{ --c1:var(--fire-amber); --c2:var(--fire-red); --c-sub:var(--fire-gold); }
  .card.loc{ --c1:#f0521a; --c2:#c21807; --c-sub:#ff7a45; }
  .card.ig{ --c1:#ee2a7b; --c2:#9b25c9; --c-sub:#f772a8; }

  /* ---- Footer ---- */
  .foot{
    margin-top:auto;
    padding-top:30px;
    text-align:center;
    font-size:11.5px;
    letter-spacing:1px;
    color:rgba(233,237,242,0.42);
    text-transform:uppercase;
    opacity:0;
    animation:fadeUp .8s ease 1.15s forwards;
  }
  .foot .div{
    width:52px;height:2px;margin:0 auto 12px;border-radius:2px;
    background:linear-gradient(90deg,var(--fire-red),var(--fire-gold));
    box-shadow:0 0 10px rgba(240,112,0,.5);
  }
  @keyframes fadeUp{ from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }

  /* ---- Floating embers ---- */
  .embers{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .ember{
    position:absolute;
    bottom:-12px;
    width:6px;height:6px;border-radius:50%;
    background:radial-gradient(circle,#ffd76b,#f05a00 60%,transparent 72%);
    opacity:0;
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{opacity:0;transform:translateY(0) scale(.6);}
    12%{opacity:.9;}
    80%{opacity:.6;}
    100%{opacity:0;transform:translateY(-108vh) translateX(var(--drift,14px)) scale(1);}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important;animation-delay:0s !important;transition:none !important;}
    .bg{animation:none;transform:scale(1.04);}
    .embers{display:none;}
    .logo,.card,.foot{opacity:1;transform:none;}
  }

  @media (min-width:560px){
    .txt .t{font-size:24px;}
    .card{padding:18px 20px;}
  }

  /* ============ DESKTOP: floating card ============ */
  @media (min-width:900px){
    body{
      background:#050506;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px 0;
    }
    /* dim the fullscreen bg into a soft dark backdrop */
    .bg{
      filter:blur(22px) brightness(.35) saturate(.9);
      transform:scale(1.2);
      animation:none;
    }
    .bg-overlay{
      background:
        radial-gradient(120% 90% at 50% 30%, rgba(240,80,0,0.10) 0%, transparent 55%),
        linear-gradient(180deg, rgba(5,5,6,0.86), rgba(5,5,6,0.94));
    }
    .embers{z-index:0;}

    /* the wrap becomes a floating rounded card holding the real image */
    .wrap{
      position:relative;
      width:460px;
      max-width:92vw;
      min-height:auto;
      margin:0;
      padding:52px 30px 50px;
      border-radius:32px;
      overflow:hidden;
      isolation:isolate;
      background-image:url("background.jpg");
      background-size:cover;
      background-position:center 34%;
      box-shadow:
        0 40px 90px -30px rgba(0,0,0,0.85),
        0 0 0 1px rgba(240,112,0,0.28),
        0 0 60px -18px rgba(240,80,0,0.45);
      animation:cardFloat 7s ease-in-out infinite;
    }
    /* dark + fire overlay INSIDE the card so text/cards keep contrast */
    .wrap::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:-1;
      border-radius:inherit;
      background:
        radial-gradient(120% 70% at 50% 8%, rgba(240,90,0,0.16) 0%, transparent 46%),
        radial-gradient(85% 45% at 50% 60%, rgba(6,6,8,0.26) 0%, transparent 80%),
        linear-gradient(180deg, rgba(6,6,8,0.42) 0%, rgba(6,6,8,0.28) 30%, rgba(6,6,8,0.38) 60%, rgba(6,6,8,0.72) 100%);
    }
    .wrap::after{
      content:"";
      position:absolute;
      inset:0;
      z-index:-1;
      border-radius:inherit;
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.08), inset 0 0 40px rgba(0,0,0,0.4);
      pointer-events:none;
    }
    .logo{width:min(84%,360px);margin-top:2px;}
    .logo-glow{top:40px;}
    .links{margin-top:26px;}
    .foot{padding-top:26px;}
  }
  @keyframes cardFloat{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
  }

  @media (min-width:900px) and (prefers-reduced-motion: reduce){
    .wrap{animation:none;}
  }

</style>
</head>

  <script>
    // Floating embers
    (function(){
      var host = document.getElementById('embers');
      if(!host) return;
      if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var N = window.innerWidth < 500 ? 6 : 10;
      for(var i=0;i<N;i++){
        var e = document.createElement('span');
        e.className='ember';
        var size = 2 + Math.random()*3.5;
        e.style.left = (Math.random()*100)+'%';
        e.style.width = size+'px';
        e.style.height = size+'px';
        e.style.setProperty('--drift', (Math.random()*60-30)+'px');
        var dur = 9 + Math.random()*8;
        e.style.animationDuration = dur+'s';
        e.style.animationDelay = (-Math.random()*dur)+'s';
        e.style.opacity = 0.18 + Math.random()*0.3;
        host.appendChild(e);
      }
    })();

    // Subtle parallax tilt on the logo (pointer / device)
    (function(){
      if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      if(!(window.matchMedia && window.matchMedia('(pointer: fine)').matches)) return;
      var logo = document.querySelector('.logo');
      var bg = document.querySelector('.bg');
      if(!logo) return;
      window.addEventListener('pointermove', function(ev){
        var cx = (ev.clientX/window.innerWidth - .5);
        var cy = (ev.clientY/window.innerHeight - .5);
        logo.style.transform = 'translate('+(cx*8)+'px,'+(cy*6)+'px)';
        if(bg) bg.style.backgroundPosition = 'calc(50% + '+(cx*-14)+'px) calc(35% + '+(cy*-10)+'px)';
      }, {passive:true});
    })();
  </script>
