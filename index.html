  .bg-overlay{
    position:fixed;
    inset:0;
    z-index:-1;
    background:
      radial-gradient(120% 80% at 50% 12%, rgba(240,80,0,0.10) 0%, transparent 45%),
      radial-gradient(80% 55% at 50% 62%, rgba(6,6,8,0.28) 0%, transparent 78%),
      linear-gradient(180deg, rgba(6,6,8,0.45) 0%, rgba(6,6,8,0.30) 30%, rgba(6,6,8,0.42) 60%, rgba(6,6,8,0.75) 100%);
  }

  @keyframes bgDrift{
    from{transform:scale(1.06) translateY(0);}
    to{transform:scale(1.12) translateY(-12px);}
  }

  /* ---- Layout shell ---- */
  .wrap{
    position:relative;
    z-index:1;
    max-width:520px;
    margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 34px) 22px calc(env(safe-area-inset-bottom) + 40px);
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100dvh;
  }

  /* ---- Logo ---- */
  .logo{
    width:min(88%,420px);
    height:auto;
    margin-top:6px;
    filter:drop-shadow(0 6px 22px rgba(0,0,0,0.6));
    opacity:0;
    transform:translateY(-26px) scale(0.94);
    animation:logoIn 1s cubic-bezier(.16,.84,.32,1) 0.15s forwards;
  }
  @keyframes logoIn{
    to{opacity:1;transform:translateY(0) scale(1);}
  }

  /* subtle floating glow behind logo */
  .logo-glow{
    position:absolute;
    top:46px;
    width:min(70%,320px);
    height:130px;
    background:radial-gradient(ellipse at center, rgba(240,96,0,0.38), transparent 70%);
    filter:blur(26px);
    z-index:-1;
    animation:glowPulse 4.5s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%,100%{opacity:.55;transform:scale(1);}
    50%{opacity:.9;transform:scale(1.08);}
  }

  /* ---- Cards ---- */

    width:100%;
    margin-top:34px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

    color:var(--silver);
    background:
      linear-gradient(135deg, rgba(20,14,12,0.82), rgba(10,8,8,0.72));
    border:1px solid rgba(255,255,255,0.06);
    box-shadow:0 8px 24px -10px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
    overflow:hidden;
    isolation:isolate;
    backdrop-filter:blur(9px) saturate(1.1);
    -webkit-backdrop-filter:blur(9px) saturate(1.1);
    /* stagger entrance */
    opacity:0;
    transform:translateY(38px) scale(0.96);
    animation:cardIn .7s cubic-bezier(.2,.8,.25,1) forwards;
    transition:transform .28s cubic-bezier(.2,.8,.25,1), box-shadow .28s ease, border-color .28s ease;
  }

  /* fire accent bar on the left */
  .card::before{
    content:"";
    position:absolute;
    left:0;top:0;bottom:0;
    width:5px;
    background:linear-gradient(180deg, var(--c1), var(--c2));
    box-shadow:0 0 14px var(--c1);
    z-index:2;
  }
  /* glow sheen that sweeps on hover */
  .card::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.10) 48%, transparent 66%);
    transform:translateX(-120%);
    transition:transform .7s ease;
    z-index:1;
    pointer-events:none;
  }

  .card:hover, .card:active{
    transform:translateY(-3px) scale(1.015);
    border-color:var(--card-border);
    box-shadow:0 14px 34px -12px rgba(0,0,0,0.85), 0 0 0 1px rgba(240,112,0,0.35), 0 10px 30px -12px var(--c1);
  }
  .card:hover::after, .card:active::after{ transform:translateX(120%); }

  .card:active{ transform:translateY(0) scale(0.985); transition-duration:.09s; }

  @keyframes cardIn{
    to{opacity:1;transform:translateY(0) scale(1);}
  }
  .card:nth-child(1){animation-delay:.55s;}
  .card:nth-child(2){animation-delay:.68s;}
  .card:nth-child(3){animation-delay:.81s;}
  .card:nth-child(4){animation-delay:.94s;}

  /* Icon capsule */
  .ic{
    flex:0 0 auto;
    width:52px;height:52px;
    border-radius:14px;
    display:grid;place-items:center;
    background:linear-gradient(140deg, var(--c1), var(--c2));
    box-shadow:0 6px 16px -4px var(--c1), inset 0 1px 0 rgba(255,255,255,0.35);
    position:relative;
    z-index:2;
  }
  .ic svg{width:28px;height:28px;display:block;}
  .ic.ig{ background:linear-gradient(135deg,#f9ce34 0%,#ee2a7b 45%,#6228d7 100%); box-shadow:0 6px 16px -4px rgba(238,42,123,.6), inset 0 1px 0 rgba(255,255,255,0.35);}
  .ic.wa{ background:linear-gradient(140deg,#37e07d,#12b866); box-shadow:0 6px 16px -4px rgba(18,184,102,.55), inset 0 1px 0 rgba(255,255,255,0.35);}

  .txt{ z-index:2; display:flex; flex-direction:column; gap:2px; }
  .txt .t{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:.5px;
    line-height:1;
    color:#fff;
    text-transform:uppercase;
  }
  .txt .s{
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.3px;
    color:var(--c-sub, var(--fire-amber));
    text-transform:uppercase;
  }

  .arrow{
    margin-left:auto;
    z-index:2;
    color:rgba(233,237,242,0.5);
    transition:transform .3s ease, color .3s ease;
  }
  .arrow svg{width:20px;height:20px;display:block;}
  .card:hover .arrow{ transform:translateX(4px); color:var(--c1); }

  /* Per-card theming */
  .card.wa{ --c1:#2ee06e; --c2:#0f9b52; --c-sub:#54e58a; }
  .card.cat{ --c1:var(--fire-amber); --c2:var(--fire-red); --c-sub:var(--fire-gold); }
  .card.loc{ --c1:#f0521a; --c2:#c21807; --c-sub:#ff7a45; }
  .card.ig{ --c1:#ee2a7b; --c2:#9b25c9; --c-sub:#f772a8; }

  /* ---- Footer ---- */
  .foot{
    margin-top:auto;
    padding-top:30px;
    text-align:center;
    font-size:11.5px;
    letter-spacing:1px;
    color:rgba(233,237,242,0.42);
    text-transform:uppercase;
    opacity:0;
    animation:fadeUp .8s ease 1.15s forwards;
  }
  .foot .div{
    width:52px;height:2px;margin:0 auto 12px;border-radius:2px;
    background:linear-gradient(90deg,var(--fire-red),var(--fire-gold));
    box-shadow:0 0 10px rgba(240,112,0,.5);
  }
  @keyframes fadeUp{ from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }

  /* ---- Floating embers ---- */
  .embers{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .ember{
    position:absolute;
    bottom:-12px;
    width:6px;height:6px;border-radius:50%;
    background:radial-gradient(circle,#ffd76b,#f05a00 60%,transparent 72%);
    opacity:0;
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{opacity:0;transform:translateY(0) scale(.6);}
    12%{opacity:.9;}
    80%{opacity:.6;}
    100%{opacity:0;transform:translateY(-108vh) translateX(var(--drift,14px)) scale(1);}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important;animation-delay:0s !important;transition:none !important;}
    .bg{animation:none;transform:scale(1.04);}
    .embers{display:none;}
    .logo,.card,.foot{opacity:1;transform:none;}
  }

  @media (min-width:560px){
    .txt .t{font-size:24px;}
    .card{padding:18px 20px;}
  }

  /* ============ DESKTOP: floating card ============ */
  @media (min-width:900px){
    body{
      background:#050506;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px 0;
    }
    /* dim the fullscreen bg into a soft dark backdrop */
    .bg{
      filter:blur(22px) brightness(.35) saturate(.9);
      transform:scale(1.2);
      animation:none;
    }
    .bg-overlay{
      background:
        radial-gradient(120% 90% at 50% 30%, rgba(240,80,0,0.10) 0%, transparent 55%),
        linear-gradient(180deg, rgba(5,5,6,0.86), rgba(5,5,6,0.94));
    }
    .embers{z-index:0;}

    /* the wrap becomes a floating rounded card holding the real image */

      max-width:92vw;

  <script>
    // Floating embers
    (function(){
      var host = document.getElementById('embers');
      if(!host) return;
      if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var N = window.innerWidth < 500 ? 14 : 22;
      for(var i=0;i<N;i++){
        var e = document.createElement('span');
        e.className='ember';
        var size = 3 + Math.random()*5;
        e.style.left = (Math.random()*100)+'%';
        e.style.width = size+'px';
        e.style.height = size+'px';
        e.style.setProperty('--drift', (Math.random()*60-30)+'px');
        var dur = 7 + Math.random()*8;
        e.style.animationDuration = dur+'s';
        e.style.animationDelay = (-Math.random()*dur)+'s';
        e.style.opacity = 0.3 + Math.random()*0.5;
        host.appendChild(e);
      }
    })();

    // Subtle parallax tilt on the logo (pointer / device)
    (function(){
      if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var logo = document.querySelector('.logo');
      var bg = document.querySelector('.bg');
      if(!logo) return;
      window.addEventListener('pointermove', function(ev){
        var cx = (ev.clientX/window.innerWidth - .5);
        var cy = (ev.clientY/window.innerHeight - .5);
        logo.style.transform = 'translate('+(cx*8)+'px,'+(cy*6)+'px)';
        if(bg) bg.style.backgroundPosition = 'calc(50% + '+(cx*-14)+'px) calc(35% + '+(cy*-10)+'px)';
      }, {passive:true});
    })();
  </script>
